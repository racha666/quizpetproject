<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Фон -->
  <rect width="32" height="32" fill="#0f0d1a" rx="6"/>

  <!-- Касаги — верхняя балка (слегка изогнутые вверх концы) -->
  <path d="M4 9 Q16 6.5 28 9 L28 11 L26.5 10.5 Q16 8 5.5 10.5 L4 11 Z" fill="#b83a3a"/>

  <!-- Нуки — вторая балка -->
  <rect x="7" y="14" width="18" height="2" fill="#b83a3a"/>

  <!-- Хасира — две вертикальные опоры -->
  <rect x="9"    y="11" width="2.5" height="16" fill="#b83a3a"/>
  <rect x="20.5" y="11" width="2.5" height="16" fill="#b83a3a"/>

  <!-- Гакудзука — центральный блок -->
  <rect x="15" y="16" width="2" height="4" fill="#b83a3a"/>
</svg>